# XcodeGen spec — source of truth for the Xcode project.
# If FightHR.xcodeproj won't open or you change files, install XcodeGen
# (brew install xcodegen) and run `xcodegen generate` in this folder.
name: FightHR
options:
  bundleIdPrefix: com.fighthr
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.7"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: ""          # set your Apple Developer Team ID here or in Xcode
    CODE_SIGN_STYLE: Automatic
    # Public client DSN for the sweatinc-qk/apple-ios Sentry project.
    SENTRY_DSN: "https://06b6946af22dd3a4531d580a1157239e@o4511966563926016.ingest.de.sentry.io/4511966567792720"
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: 9.24.0
targets:
  FightHR:
    type: application
    platform: iOS
    sources:
      - path: FightHR/Sources
      - path: FightHR/Assets.xcassets
    info:
      path: FightHR/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fighthr.app
        PRODUCT_NAME: FightHR
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: Sentry
        product: SentrySPM
